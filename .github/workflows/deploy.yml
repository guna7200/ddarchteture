name: Deploy Website to Live Host

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy Build
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔧 Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies & Build
        run: |
          npm install
          npm run build

      - name: 🚀 Trigger Automatic Webhook Deployment
        run: |
          curl -f "http://archideesigns.egitimdemo.co.in/deploy.php?secret=archidee_deploy_2026_key" || curl -f "http://65.109.112.7/deploy.php?secret=archidee_deploy_2026_key"
